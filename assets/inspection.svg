<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" role="img" aria-label="Kanal-TV-Inspektion mit Kamera und Monitor">
  <defs>
    <linearGradient id="i-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a63"/>
      <stop offset="1" stop-color="#0a2440"/>
    </linearGradient>
    <linearGradient id="i-water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e86d4"/>
    </linearGradient>
    <radialGradient id="i-screen" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#14406b"/>
      <stop offset="1" stop-color="#08243f"/>
    </radialGradient>
  </defs>

  <rect width="520" height="460" rx="28" fill="url(#i-bg)"/>
  <circle cx="430" cy="80" r="60" fill="#ffffff" opacity="0.05"/>
  <circle cx="70" cy="360" r="46" fill="#22d3ee" opacity="0.08"/>

  <!-- Monitor -->
  <g>
    <rect x="60" y="60" width="240" height="160" rx="14" fill="#0a1a2b"/>
    <rect x="72" y="72" width="216" height="126" rx="8" fill="url(#i-screen)"/>
    <!-- Rohr im Bild -->
    <ellipse cx="180" cy="135" rx="86" ry="56" fill="none" stroke="#2a6fb0" stroke-width="8" opacity="0.7"/>
    <ellipse cx="180" cy="135" rx="52" ry="34" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.6"/>
    <ellipse cx="180" cy="135" rx="22" ry="14" fill="#08243f"/>
    <!-- erkannter Riss -->
    <path d="M180 79 q10 20 -6 34 q-14 12 4 22" fill="none" stroke="#f7871f" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="182" cy="93" r="10" fill="none" stroke="#ff6a00" stroke-width="2.5"/>
    <!-- HUD -->
    <rect x="82" y="82" width="46" height="9" rx="4" fill="#22d3ee" opacity="0.5"/>
    <text x="86" y="192" fill="#7fd7f7" font-family="monospace" font-size="10">REC ● 12.4 m</text>
    <!-- Standfuß -->
    <rect x="168" y="220" width="24" height="26" fill="#0a1a2b"/>
    <rect x="130" y="244" width="100" height="12" rx="6" fill="#132f4c"/>
  </g>

  <!-- Kabel zur Kamera -->
  <path d="M300 150 C360 150 360 300 330 330" fill="none" stroke="#f7871f" stroke-width="5" stroke-linecap="round"/>

  <!-- Rohr im Boden -->
  <g>
    <path d="M300 330 H520 V400 H300 Z" fill="#0a1a2b"/>
    <rect x="300" y="330" width="220" height="70" fill="none" stroke="#2a6fb0" stroke-width="3" opacity="0.6"/>
    <rect x="300" y="372" width="220" height="20" fill="url(#i-water)" opacity="0.85"/>
    <!-- Kamera-Sonde -->
    <g>
      <rect x="322" y="352" width="34" height="24" rx="8" fill="#e6eef6"/>
      <circle cx="352" cy="364" r="9" fill="#0e3a63"/>
      <circle cx="352" cy="364" r="4" fill="#22d3ee"/>
      <!-- Lichtkegel -->
      <path d="M361 364 L440 344 L440 384 Z" fill="#22d3ee" opacity="0.16"/>
    </g>
  </g>

  <!-- Bodenlinie oben -->
  <path d="M300 330 H520" stroke="#ffffff" stroke-width="2" opacity="0.12"/>
  <path d="M40 300 H300" stroke="#ffffff" stroke-width="2" opacity="0.1"/>
</svg>
